<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title></title>
    <style>
      html,
      body {
        min-height: 100vh;
        margin: 0;
        background: #fff;
      }

      body {
        display: grid;
        place-items: center;
      }

      .verse {
        margin: 0;
        padding: 2rem;
        color: #fff;
        font-family: serif;
        font-size: 17pt;
        line-height: 1.8;
        text-align: center;
      }

      .verse-line {
        display: block;
      }

      .verse a,
      .verse a:hover,
      .verse a:focus,
      .verse a:visited {
        color: inherit;
        text-decoration: none;
        outline: 0;
      }
    </style>
  </head>
  <body>
    <p class="verse">
      <span class="verse-line">若以色見<a href="https://space.bilibili.com/382858356" aria-label="Bilibili profile">我</a></span>
      <span class="verse-line">以音聲求<a href="https://www.floruit.show" aria-label="Floruit music page">我</a></span>
      <span class="verse-line">是人行邪道</span>
      <span class="verse-line">不能見如來</span>
    </p>
  </body>
</html>
