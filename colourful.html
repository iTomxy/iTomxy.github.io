    <style>
      body {
        background:
          radial-gradient(circle at 18% 16%, rgba(255, 226, 155, 0.92), transparent 34%),
          radial-gradient(circle at 84% 20%, rgba(146, 218, 215, 0.86), transparent 35%),
          radial-gradient(circle at 76% 86%, rgba(221, 163, 210, 0.82), transparent 38%),
          linear-gradient(145deg, #f09a86 0%, #d7b7dd 48%, #79c7bd 100%);
        background-attachment: fixed;
        min-height: 100vh;
      }

      .name {
        --glyph-height: 105px;
        --glyph-gap: 3;
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: calc(var(--glyph-height) / var(--glyph-gap));
      }

      .glyph {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: calc(var(--glyph-height) / 10);
      }

      .ancient-glyph {
        display: block;
        height: var(--glyph-height);
        width: auto;
        fill: currentColor;
      }

      .ipa {
        font-family: "Charis SIL", "Doulos SIL", "Gentium Plus", "Times New Roman", Times, serif;
        font-size: 12pt;
        font-weight: 400;
        line-height: 1;
        white-space: nowrap;
      }

      @media (max-width: 600px) {
        .name {
          --glyph-height: 81px;
          --glyph-gap: 4;
        }
      }

      @media (max-width: 410px) {
        .name {
          --glyph-height: 105px;
          --glyph-gap: 3;
        }
      }
    </style>
